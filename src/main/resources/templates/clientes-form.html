<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo cliente | Barber Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="layout">

        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content">

            <header th:replace="~{fragments/topbar :: topbar(
    ${clienteId == null ? 'Nuevo cliente' : 'Editar cliente'},
    ${clienteId == null
        ? 'Registra un nuevo cliente de la barbería'
        : 'Actualiza la información del cliente'}
)}"></header>

            <section class="dashboard-section">

                <form th:action="${clienteId == null}
        ? @{/clientes}
        : @{/clientes/{id}(id=${clienteId})}" th:object="${cliente}" method="post">

                    <div class="form-group">
                        <label>Nombre</label>

                        <input type="text" th:field="*{nombre}">

                        <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Apellido</label>

                        <input type="text" th:field="*{apellido}">

                        <p class="error-message" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>

                        <input type="text" th:field="*{telefono}">

                        <p class="error-message" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Email</label>

                        <input type="email" th:field="*{email}">

                        <p class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        </p>
                    </div>

                    <button type="submit" th:text="${clienteId == null} ? 'Guardar cliente' : 'Actualizar cliente'">
                        Guardar
                    </button>

                    <a th:href="@{/clientes}">
                        Cancelar
                    </a>

                </form>

            </section>

        </main>

    </div>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>

</html>
