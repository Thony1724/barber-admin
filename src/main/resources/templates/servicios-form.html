<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo cliente | Barber Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="layout">

        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content">


            <header th:replace="~{fragments/topbar :: topbar(
    'Servicios',
    'Administración de servicios de la barbería'
)}"></header>

            <section class="dashboard-section">

                <form th:action="${servicioId == null}
            ? @{/servicios}
            : @{/servicios/{id}(id=${servicioId})}" th:object="${servicio}" method="post">

                    <div class="form-group">
                        <label>Nombre</label>

                        <input type="text" th:field="*{nombre}">

                        <p class="error-message" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>

                        <textarea th:field="*{descripcion}" rows="4">
            </textarea>

                        <p class="error-message" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Precio (S/)</label>

                        <input type="number" th:field="*{precio}" min="0.01" step="0.01">

                        <p class="error-message" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}">
                        </p>
                    </div>

                    <div class="form-group">
                        <label>Duración (minutos)</label>

                        <input type="number" th:field="*{duracionMinutos}" min="1" step="1">

                        <p class="error-message" th:if="${#fields.hasErrors('duracionMinutos')}"
                            th:errors="*{duracionMinutos}">
                        </p>
                    </div>

                    <button type="submit" class="btn-primary" th:text="${servicioId == null}
                ? 'Guardar servicio'
                : 'Actualizar servicio'">
                        Guardar
                    </button>

                    <a th:href="@{/servicios}">
                        Cancelar
                    </a>

                </form>

            </section>

        </main>

    </div>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>

</html>
