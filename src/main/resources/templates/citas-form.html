<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo cliente | Barber Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="layout">

        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

        <main class="main-content">

            <header th:replace="~{fragments/topbar :: topbar(
    'Citas',
    'Administración del personal de la barbería'
)}"></header>

            <section class="dashboard-section">

                <form th:action="@{/citas}" th:object="${cita}" method="post">

                    <!-- Error general -->
                    <div class="alert-error" th:if="${errorGeneral}" th:text="${errorGeneral}">
                    </div>

                    <!-- Cliente -->
                    <div class="form-group">
                        <label>Cliente</label>

                        <select th:field="*{clienteId}">
                            <option value="">Seleccione un cliente</option>

                            <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                                th:text="${cliente.nombre + ' ' + cliente.apellido}">
                            </option>
                        </select>

                        <p class="error-message" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}">
                        </p>
                    </div>

                    <!-- Barbero -->
                    <div class="form-group">
                        <label>Barbero</label>

                        <select th:field="*{barberoId}">
                            <option value="">Seleccione un barbero</option>

                            <option th:each="barbero : ${barberos}" th:value="${barbero.id}"
                                th:text="${barbero.nombre + ' ' + barbero.apellido}">
                            </option>
                        </select>

                        <p class="error-message" th:if="${#fields.hasErrors('barberoId')}" th:errors="*{barberoId}">
                        </p>
                    </div>

                    <!-- Servicio -->
                    <div class="form-group">
                        <label>Servicio</label>

                        <select th:field="*{servicioId}">
                            <option value="">Seleccione un servicio</option>

                            <option th:each="servicio : ${servicios}" th:value="${servicio.id}"
                                th:text="${servicio.nombre + ' - S/ ' + servicio.precio}">
                            </option>
                        </select>

                        <p class="error-message" th:if="${#fields.hasErrors('servicioId')}" th:errors="*{servicioId}">
                        </p>
                    </div>

                    <!-- Fecha -->
                    <div class="form-group">
                        <label>Fecha</label>

                        <input type="date" th:field="*{fecha}">

                        <p class="error-message" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}">
                        </p>
                    </div>

                    <!-- Hora -->
                    <div class="form-group">
                        <label>Hora</label>

                        <input type="time" th:field="*{hora}">

                        <p class="error-message" th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}">
                        </p>
                    </div>

                    <button type="submit" class="btn-primary">
                        Guardar cita
                    </button>

                    <a th:href="@{/citas}">
                        Cancelar
                    </a>

                </form>

            </section>

        </main>

    </div>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>

</html>
