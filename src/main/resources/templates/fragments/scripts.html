<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

    <th:block th:fragment="scripts">

        <!-- Librería de iconos Lucide -->
        <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

        <!-- Inicializar iconos -->
        <script>
            if (window.lucide) {
                lucide.createIcons();
            }
        </script>

    </th:block>

</body>
</html>
