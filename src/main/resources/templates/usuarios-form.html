
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nuevo usuario | Barber Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="layout">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content">

        <header th:replace="~{fragments/topbar :: topbar('Nuevo usuario', 'Registrar una cuenta de acceso')}"></header>

        <section class="dashboard-section">

            <div class="section-header">
                <h2>Registrar usuario</h2>
            </div>

            <p class="error-message"
               th:if="${errorGeneral}"
               th:text="${errorGeneral}">
            </p>

            <form th:action="@{/usuarios}"
                  th:object="${usuario}"
                  method="post">

                <div class="form-group">

                    <label for="username">Usuario</label>

                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           autocomplete="off"
                           required>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('username')}"
                           th:errors="*{username}">
                    </small>

                </div>

                <div class="form-group">

                    <label for="password">Contraseña</label>

                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           autocomplete="new-password"
                           minlength="12"
                           required>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">
                    </small>

                </div>

                <div class="form-group">

                    <label for="rol">Rol</label>

                    <select id="rol"
                            th:field="*{rol}"
                            required>

                        <option value="">Seleccione un rol</option>

                        <option th:each="rol : ${roles}"
                                th:value="${rol}"
                                th:text="${rol}">
                        </option>

                    </select>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('rol')}"
                           th:errors="*{rol}">
                    </small>

                </div>

                <div class="actions">

                    <button type="submit" class="btn-primary">
                        <i data-lucide="save"></i>
                        Guardar usuario
                    </button>

                    <a th:href="@{/usuarios}"
                       class="btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
