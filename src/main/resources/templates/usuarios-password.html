
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña | Barber Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="layout">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content">

        <header th:replace="~{fragments/topbar :: topbar('Restablecer contraseña', 'Administración de accesos')}"></header>

        <section class="dashboard-section">

            <div class="section-header">
                <h2>Restablecer contraseña</h2>
            </div>

            <p>
                Usuario:
                <strong th:text="${username}">barbero01</strong>
            </p>

            <form th:action="@{/usuarios/{id}/password(id=${usuarioId})}"
                  th:object="${passwordDTO}"
                  method="post"
                  class="password-form">

                <div class="form-group">

                    <label for="passwordNueva">
                        Nueva contraseña
                    </label>

                    <input type="password"
                           id="passwordNueva"
                           th:field="*{passwordNueva}"
                           autocomplete="new-password"
                           minlength="12"
                           required>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('passwordNueva')}"
                           th:errors="*{passwordNueva}">
                    </small>

                </div>

                <div class="form-group">

                    <label for="confirmarPassword">
                        Confirmar contraseña
                    </label>

                    <input type="password"
                           id="confirmarPassword"
                           th:field="*{confirmarPassword}"
                           autocomplete="new-password"
                           required>

                    <small class="error-message"
                           th:if="${#fields.hasErrors('confirmarPassword')}"
                           th:errors="*{confirmarPassword}">
                    </small>

                </div>

                <div class="actions">

                    <button type="submit" class="btn-primary">
                        <i data-lucide="key-round"></i>
                        Restablecer contraseña
                    </button>

                    <a th:href="@{/usuarios}"
                       class="btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
