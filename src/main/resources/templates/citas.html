<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Citas | Barber Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="layout">

        <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>


        <main class="main-content">

            <header th:replace="~{fragments/topbar :: topbar(
    'Barberos',
    'Administración del personal de la barbería'
)}"></header>


            <section class="dashboard-section">

                <div class="section-header">
                    <div>
                        <h2>Citas</h2>
                        <p>Administra las reservas de la barbería</p>
                    </div>

                    <a th:href="@{/citas/nuevo}" class="btn-primary">
                        Nueva cita
                    </a>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Barbero</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="cita : ${citas}">

                            <td th:text="${cita.id}"></td>

                            <td th:text="${cita.cliente.nombre + ' ' + cita.cliente.apellido}"></td>

                            <td th:text="${cita.barbero.nombre + ' ' + cita.barbero.apellido}"></td>

                            <td th:text="${cita.servicio.nombre}"></td>

                            <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td>

                            <td th:text="${#temporals.format(cita.hora, 'HH:mm')}"></td>

                            <td th:text="${cita.estado}"></td>

                            <td class="actions">

                                <!-- CONFIRMAR CITA -->
                                <form th:if="${cita.estado.name() == 'PROGRAMADA'}"
                                    th:action="@{/citas/{id}/confirmar(id=${cita.id})}" method="post">

                                    <button type="submit" class="btn-confirmar">
                                        <i data-lucide="check-circle"></i>
                                        Confirmar
                                    </button>

                                </form>

                                <!-- COMPLETAR CITA -->
                                <form th:if="${cita.estado.name() == 'CONFIRMADA'}"
                                    th:action="@{/citas/{id}/completar(id=${cita.id})}" method="post">

                                    <button type="submit" class="btn-completar">
                                        <i data-lucide="check-check"></i>
                                        Completar
                                    </button>

                                </form>

                                <!-- CANCELAR CITA -->
                                <form th:if="${cita.estado.name() == 'PROGRAMADA'
                  or cita.estado.name() == 'CONFIRMADA'}" th:action="@{/citas/{id}/cancelar(id=${cita.id})}"
                                    method="post">

                                    <button type="submit" class="btn-delete"
                                        onclick="return confirm('¿Deseas cancelar esta cita?')">

                                        <i data-lucide="x-circle"></i>
                                        Cancelar

                                    </button>

                                </form>

                            </td>

                        </tr>
                    </tbody>
                </table>

                <div class="empty-state" th:if="${#lists.isEmpty(citas)}">
                    <h3>No hay citas registradas</h3>
                    <p>Comienza creando una nueva cita.</p>
                </div>

            </section>

        </main>

    </div>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>

</html>
